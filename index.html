<!DOCTYPE html><html lang=id><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Login - Pemesanan Makanan &amp; Minuman</title><link href=https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css rel=stylesheet><link rel=stylesheet href=/dadpool/dadpool.b7d0a545.css><script src=/dadpool/dadpool.74f4e358.js></script><body class=bg-gray-50>

    
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <img src=/dadpool/dadpool.a2f4313f.jpg style=justify-self:center class="align-center rounded-full text-center">
            <h2 class="font-semibold mb-6 text-2xl text-center">Selamat Datang Pemesanan Di Dadpool</h2>
            <form id=loginForm>
                <div class=mb-4>
                    <label for=nomorMeja class="block font-medium text-gray-700 text-sm">Masukkan Nomor Meja</label>
                    <input id=nomorMeja name=nomorMeja required class="border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mt-1 p-2 rounded-lg w-full" placeholder="Nomor Meja">
                </div>
                <button class="bg-blue-500 duration-200 hover:bg-blue-600 py-2 rounded-lg text-white transition w-full">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <script>const loginForm=document.getElementById("loginForm");loginForm.addEventListener("submit",e=>{e.preventDefault();let o=document.getElementById("nomorMeja").value;localStorage.setItem("nomorMeja",o),window.location.href="./user/pesan.html"});</script>
